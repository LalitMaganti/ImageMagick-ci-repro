name: CI build waste repro (imagemagick)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imagemagick:
    strategy:
      fail-fast: false
      matrix:
        variant:
        - before
        - after
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Runner hardware
      run: nproc; free -g | head -2; lscpu | grep -E 'Model name|Thread|Core|Socket'
    - name: Install dependencies (as main.yml's Linux gcc job)
      run: sudo apt-get update -y && sudo apt-get install -y autoconf libtool make pkg-config gcc g++
    - name: Configure (as main.yml's Linux gcc job)
      env:
        CC: gcc
        CXX: g++
        CFLAGS: -Wall -Wextra -Werror -Wno-builtin-declaration-mismatch
        CXXFLAGS: -Wall -Wextra -Werror -Wno-builtin-declaration-mismatch
      run: 'autoreconf -fiv

        ./configure --with-quantum-depth=16 --enable-hdri=no --without-perl --prefix=/usr

        '
    - uses: LalitMaganti/buildprof@v0.2.8
      with:
        artifact-name: imagemagick-${{ matrix.variant }}
        command: 'if [ "${{ matrix.variant }}" = after ]; then J=-j$(getconf _NPROCESSORS_ONLN); fi

          make $J

          make $J check

          '
